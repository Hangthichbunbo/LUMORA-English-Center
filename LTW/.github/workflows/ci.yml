name: StoryHub CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore StoryHub.slnx

    - name: Build Solution
      run: dotnet build StoryHub.slnx -c Release --no-restore

    - name: Run Tests with Code Coverage
      run: dotnet test tests/StoryHub.Tests/StoryHub.Tests.csproj -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
