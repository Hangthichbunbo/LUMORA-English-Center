<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="popBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="400" rx="16" fill="url(#popBg)"/>
  
  <!-- Decorative Circles -->
  <circle cx="530" cy="70" r="100" fill="#60a5fa" opacity="0.1" />
  <circle cx="80" cy="330" r="120" fill="#38bdf8" opacity="0.08" />

  <!-- Badge -->
  <rect x="40" y="45" width="160" height="30" rx="15" fill="#f59e0b" />
  <text x="120" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">ƯU ĐÃI ĐẶC BIỆT</text>

  <!-- Main Title -->
  <text x="40" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">
    Chào Mừng Bạn Đến Với
  </text>
  <text x="40" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#38bdf8">
    TruyenVietSub
  </text>

  <!-- Subtitle / Description -->
  <text x="40" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#cbd5e1">
    Nền tảng đọc truyện online tốc độ cao, không giật lag.
  </text>
  <text x="40" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">
    Hàng ngàn chương truyện mới được dịch và cập nhật mỗi ngày!
  </text>

  <!-- Feature Tags -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="140" height="28" rx="6" fill="#334155" opacity="0.8"/>
    <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">⚡ Tốc độ siêu tốc</text>
    
    <rect x="155" y="0" width="130" height="28" rx="6" fill="#334155" opacity="0.8"/>
    <text x="220" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">📖 100% Miễn phí</text>

    <rect x="300" y="0" width="140" height="28" rx="6" fill="#334155" opacity="0.8"/>
    <text x="370" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">✨ Giao diện tối ưu</text>
  </g>

  <!-- CTA Button Graphic -->
  <g transform="translate(40, 315)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="46" rx="23" fill="url(#btnGrad)" />
    <text x="110" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">KHÁM PHÁ NGAY ➔</text>
  </g>
</svg>
